# folders
temporary_folder: "/tmp/ansible-containerd"
install_path: /usr/local/bin
runc_path: "/usr/local/sbin/runc"
containerd_systemctl_folder: "/usr/local/lib/systemd/system/"
cni_plugin_folder: "/opt/cni/bin"

# versions
containerd_version: "1.7.28"
runc_version: "1.3.0"
cni_plugin_version: "1.7.1"

# Urls
github_url: "https://github.com"
containerd_url: "{{ github_url }}/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
containerd_systemctl_url: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
runc_url: "{{ github_url }}/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64"
cni_plugin_url: "{{ github_url }}/containernetworking/plugins/releases/download/v{{ cni_plugin_version }}/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz"
