- name: Create the system containerd group
  ansible.builtin.group:
    name: containerd
    state: present
    system: true

- name: Add the current user to the containerd group
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: containerd
    append: true

- name: Create and secure the containerd runtime directory
  ansible.builtin.file:
    path: "/var/run/containerd"
    state: directory
    mode: "0760"
    owner: root
    group: containerd
    recurse: true

- name: Reload the systemd daemon configuration
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start the containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Ensure the containerd socket is owned by the containerd group
  ansible.builtin.file:
    path: "/run/containerd/containerd.sock"
    group: containerd
    mode: "0660"
  register: socket_ownership
  until: socket_ownership is not failed
  retries: 5
  delay: 2

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate the default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Write the default containerd configuration
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default_config.stdout }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Enable the systemd cgroup driver in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Restart containerd to apply its configuration
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted