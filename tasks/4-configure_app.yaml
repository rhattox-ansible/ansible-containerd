- name: Create containerd group
  ansible.builtin.group:
    name: containerd
    state: present
    system: true

- name: Add ansible user to containerd group
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    groups: containerd
    append: true

- name: Set directory permissions for containerd
  ansible.builtin.file:
    path: "/var/run/containerd"
    state: directory
    mode: "0760"
    owner: root
    group: containerd
    recurse: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Set containerd socket group ownership
  ansible.builtin.file:
    path: "/run/containerd/containerd.sock"
    group: containerd
    mode: "0660"
  register: socket_ownership
  until: socket_ownership is not failed
  retries: 5
  delay: 2
